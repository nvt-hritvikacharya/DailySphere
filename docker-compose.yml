services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (e.g. openssl rand -hex 24)}
      POSTGRES_DB: dailysphere
    # Only reachable from this machine; the app container talks to it over the compose network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/dailysphere?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Hourly refresh: pre-warms each time zone's content after local midnight,
  # sends daily-briefing notifications, and purges expired cache/logs.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env
    depends_on:
      - app
    entrypoint: >
      sh -c 'while true; do
        curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/refresh || true;
        sleep 3600;
      done'

volumes:
  pgdata:
